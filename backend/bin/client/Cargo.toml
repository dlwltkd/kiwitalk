[package]
name = "kiwi-talk-client"
description = "KiwiTalk client"
publish = false

version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
diagnostics = []

[dependencies]
talk-loco-client = { workspace = true }
headless-talk = { workspace = true }

kiwi-talk-api = { path = "../api" }
kiwi-talk-system = { path = "../system" }
kiwi-talk-result = { path = "../result" }
kiwi-talk-resource = { path = "../resource" }

tokio = { workspace = true, features = ["rt", "time"] }
tokio-native-tls = "0.3.1"
tauri = { workspace = true }
tauri-plugin-notification = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
log = { workspace = true }

futures = "0.3.30"
sha2 = "0.10.8"
parking_lot = "0.12.1"
num-bigint-dig = "0.8.4"
once_cell = "1.19.0"
tokio-util = { version = "0.7.10", features = ["compat"] }
hex = "0.4.3"

[dev-dependencies]
dotenvy = "0.15.7"
reqwest = "0.12.4"
talk-api-internal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.9.0"

[[example]]
name = "android_loco_probe"
path = "examples/android_loco_probe.rs"
required-features = ["diagnostics"]
