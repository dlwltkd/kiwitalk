[package]
name = "kiwi-talk-app"
description = "A Tauri App"
default-run = "kiwi-talk-app"
publish = false

version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
talk-loco-client = { workspace = true }

kiwi-talk-system = { path = "../system" }
kiwi-talk-result = { path = "../result" }
kiwi-talk-api = { path = "../api" }
kiwi-talk-client = { path = "../client" }

tokio = { workspace = true, features = ["full"] }
tauri = { workspace = true, features = ["tray-icon", "macos-private-api"] }
anyhow = { workspace = true, features = ["backtrace"] }
log = { workspace = true }
serde = { workspace = true }

serde_json = "1.0.116"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = { workspace = true }
tauri-plugin-window-state = "2"
window-vibrancy = "0.5.0"
tauri-plugin-single-instance = "2"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
